<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>Mofiebet — Private Ticket Booking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">

<!-- Firebase Compat SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>

<!-- Top Navigation -->
<header class="topbar">
  <div class="topbar-top">
    <div class="brand" onclick="selectSite('Betpawa')">
      <div class="logo">M</div>
      <div class="brand-text">
        <strong class="logo-text">Mofiebet</strong>
        <span>Private Booking</span>
      </div>
    </div>
    <div class="head-right" id="head-right"></div>
  </div>
  
  <!-- Betting Site Tabs -->
  <nav class="nav-sites" id="nav-sites"></nav>
</header>

<!-- Slide-out Profile Menu -->
<div id="side-menu" class="side-menu">
  <div class="side-menu-header">
    <div id="sm-avatar" class="avatar">H</div>
    <h3 id="sm-name">User Name</h3>
    <p id="sm-email" class="muted">email@example.com</p>
    <p id="sm-tier" class="sm-tier">Free Account</p>
  </div>
  <div class="side-menu-links">
    <button onclick="go('profile')">
      <span class="menu-icon">👤</span> Profile & Bookings
    </button>
    <button id="sm-admin-link" style="display:none" onclick="go('admin')">
      <span class="menu-icon">🛡️</span> Admin Dashboard
    </button>
    <button class="danger" onclick="logout()">
      <span class="menu-icon">🚪</span> Log out
    </button>
  </div>
</div>

<div id="menu-backdrop" class="menu-backdrop" onclick="toggleMenu()"></div>

<!-- Main App Container -->
<main id="app">
  <div style="text-align:center; padding: 80px 20px; color: var(--muted);">
    <div class="logo lg" style="margin: 0 auto 20px;">M</div>
    <h2 style="font-size:18px;">Connecting to Mofiebet...</h2>
  </div>
</main>

<footer>
  <p>© 2026 Mofiebet. All rights reserved.</p>
  <p style="margin-top:8px; font-size:11.5px;">Contact us on WhatsApp: <b>+256790311166</b> or <b>+256748368400</b></p>
  <p style="margin-top:8px; font-size:11px; opacity:0.6;">18+ · Bet responsibly</p>
</footer>

<div id="modal-root"></div>
<div id="toasts"></div>

<script src="app.js"></script>
</body>
</html>
